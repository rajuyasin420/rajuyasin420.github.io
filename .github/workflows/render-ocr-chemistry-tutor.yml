name: Render OCR Chemistry Tutor Video

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "chemistry-tutor/**"
      - ".github/workflows/render-ocr-chemistry-tutor.yml"
  push:
    paths:
      - "chemistry-tutor/**"
      - ".github/workflows/render-ocr-chemistry-tutor.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config
      - name: Install Manim
        run: python -m pip install "manim>=0.18,<0.20"
      - name: Render lesson video
        run: manim -qh chemistry-tutor/tutor.py MolecularShapesTutor
      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: ocr-molecular-shapes-tutor
          path: media/videos/tutor/1080p60/MolecularShapesTutor.mp4
          if-no-files-found: error
          retention-days: 14
